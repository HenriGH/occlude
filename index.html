<!doctype html>
<html lang="de" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Occlude" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest-dark.webmanifest" />
    <script>
      // Match the last chosen appearance before the app/database finish loading.
      (() => {
        let theme = 'dark';
        try {
          const saved = localStorage.getItem('occlude-appearance');
          if (['light', 'dark', 'system'].includes(saved)) theme = saved;
        } catch {}
        const dark = theme === 'dark' || theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches;
        const color = dark ? '#000000' : '#f5f5f7';
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.documentElement.style.setProperty('--bg', color);
        document.documentElement.style.backgroundColor = color;
        document.querySelector('meta[name="color-scheme"]').content = dark ? 'dark' : 'light';
        document.querySelector('link[rel="manifest"]').setAttribute('href', dark ? '/manifest-dark.webmanifest' : '/manifest.webmanifest');
        document.querySelector('meta[name="theme-color"]').content = color;
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content = dark ? 'black-translucent' : 'default';
      })();
    </script>
    <meta name="description" content="Occlude – aus deinen Vorlesungsfolien werden Lernkarten." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=white" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=white" />
    <title>Occlude · Einfach im Kopf behalten</title>
  </head>
  <body style="background-color: var(--bg, #000000)"><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
