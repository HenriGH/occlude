name: Android preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'scripts/*android*', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'scripts/*android*', '.github/workflows/android.yml']

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and lint APK
        run: bash scripts/build-android-preview.sh
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Check actual Android system bars
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell cmd uimode night no
            adb shell cmd overlay enable-exclusive --category com.android.internal.systemui.navbar.gestural
            cd android && ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Upload test APK and checksum
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: occlude-android-preview
          path: artifacts/occlude-android-preview.apk*
          if-no-files-found: error
      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/androidTests/
